version: "3.8"
# SlawdCode — convenience compose file
# Usage: podman-compose run --rm claude [claude-args]
#    or: docker compose run --rm claude [claude-args]
#
# Authentication: run 'slawdcode-auth' (or 'make auth') before first use.
# API key fallback: set ANTHROPIC_API_KEY in your shell or a .env file.

services:
  claude:
    image: slawdcode:latest
    environment:
      # Only set if using API key fallback (OAuth preferred — see slawdcode-auth)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Mount current project directory
      - .:/workspace:z
      # Mount host config directory (project history, MCP server config, etc.)
      - ${HOME}/.claude:/home/claude/.claude:z
      # Mount the host session/login-state file so OAuth tokens persist.
      # Touch ~/.claude.json on the host before first 'compose run' if it
      # does not already exist, otherwise compose will create it as a dir.
      - ${HOME}/.claude.json:/home/claude/.claude.json:z
    working_dir: /workspace
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
